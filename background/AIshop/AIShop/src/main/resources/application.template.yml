server:
  port: 8081
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev            # 本地开发激活 dev；部署时亦为 dev

  application:
    name: AIShop

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
      file-size-threshold: 0

  # ============ 数据源（请自行补充 MySQL 连接信息）============
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aishop}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${MYSQL_USERNAME:root}        # 你的 MySQL 用户名
    password: ${MYSQL_PASSWORD:}            # 你的 MySQL 密码
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # ============ Redis（请自行补充）============
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}          # 你的 Redis 密码
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ============ RabbitMQ（请自行补充）============
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}    # 你的 RabbitMQ 用户名
    password: ${RABBITMQ_PASSWORD:guest}    # 你的 RabbitMQ 密码
    virtual-host: /
    connection-timeout: 3000
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  # Redis 缓存
  cache:
    type: redis
    redis:
      time-to-live: 3600000ms
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "AISHOP_CACHE:"

  # Jackson JSON
  jackson:
    default-property-inclusion: non_null

  # ============ 邮件 SMTP（请自行补充）============
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:your@qq.com}  # 你的邮箱
    password: ${MAIL_PASSWORD:}             # 你的授权码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.aishop.entity

# ========== Knife4j 接口文档 ==========
knife4j:
  enable: true              # 生产环境设为 false
  production: false
  basic:
    enable: false
    username: admin
    password: change-me
  openapi:
    title: 智汇购API文档
    description: 智汇购接口文档
    version: 1.0.0

# ========== JWT（请自行补充，生产用强随机串）==========
jwt:
  secret: ${JWT_SECRET:ChangeThisSecretKey}
  expire: 86400000
  header: token

# ========== 文件上传（本地路径）==========
file:
  local:
    upload-path: ${FILE_LOCAL_UPLOAD_PATH:./uploads}
    access-prefix: /api/upload/

# ========== AI 对话（请自行补充 DashScope API Key）==========
ai:
  chat:
    # LangChain4j OpenAI 兼容模式 baseUrl
    base-url: ${AI_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_CHAT_API_KEY:}            # 你的 DashScope API Key（sk- 开头）
    model: ${AI_CHAT_MODEL:qwen3.6-plus}
    max-tokens: 2000
    temperature: 0.7
  rag:
    enabled: true
    embedding-model: text-embedding-v3
    top-k: 5
    similarity-threshold: 0.6
    knowledge-ttl: 3600
    search-cache-ttl: 60
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0

# 阿里巴巴 OpenAI 兼容配置（解决 Spring AI 自动配置需要 api-key）
spring.ai.openai.api-key: ${AI_CHAT_API_KEY:}
spring.ai.openai.base-url: ${AI_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

# ========== PostgreSQL 向量库 pgvector（可选，低内存环境可关闭）==========
pgvector:
  enabled: true             # false 时跳过向量库连接，省 ~350MB 内存
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:127.0.0.1}:${PGVECTOR_PORT:5432}/${PGVECTOR_DATABASE:aishop_rag}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:}
    driver-class-name: org.postgresql.Driver

# ========== 支付宝沙箱（请自行补充密钥）==========
alipay:
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  app-id: ${ALIPAY_APP_ID:}                 # 你的沙箱 AppID
  private-key: ${ALIPAY_PRIVATE_KEY:}       # 你的应用私钥
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}  # 支付宝公钥
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/#/payment}
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8081/api/pay/notify}

logging:
  level:
    root: info
    org.example.aishop: debug